name: home_utility_monorepo
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - apps/app
  - packages/adapters/*
  - packages/core/*
  - packages/shared/*
  - packages/core/core_hardware/example
  - packages/design_system
  - packages/design_system/example
  - packages/plugins/*
  - packages/plugins/plugin_item_tracker/example

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.9.0
  test: ^1.28.0

melos:
  repository: https://github.com/org/home_utility_monorepo

  command:
    bootstrap:
      hooks:
        # El código generado no se versiona: `melos bs` lo genera al terminar.
        post: melos run gen

  scripts:
    verify:
      description: Verificación completa (análisis, arquitectura y pruebas).
      steps:
        - analyze
        - verify:arch
        - test

    analyze:
      description: Análisis estático del workspace (falla con cualquier problema salvo las reglas en adopción de tool/analyze.dart).
      run: dart run tool/analyze.dart

    test:
      description: Ejecuta las pruebas de todos los paquetes y del tooling.
      steps:
        - test:flutter
        - test:dart
        - test:tool

    test:flutter:
      description: Pruebas de los paquetes que dependen de Flutter.
      packageFilters:
        flutter: true
        dirExists: test
      exec:
        command: flutter test
        concurrency: 1

    test:dart:
      description: Pruebas de los paquetes Dart puros.
      packageFilters:
        flutter: false
        dirExists: test
      exec:
        command: dart test
        concurrency: 1

    test:tool:
      description: Pruebas del verificador de arquitectura.
      run: dart test tool/test

    verify:arch:
      description: Verifica las reglas de importación del §5.2 de la spec.
      run: dart run tool/verify_architecture.dart

    build:apk:
      description: Genera el APK de release de apps/app (apps/app/build/app/outputs/flutter-apk/app-release.apk).
      packageFilters:
        scope: home_utility_app
      exec:
        command: flutter build apk --release

    gen:
      description: Genera el código que no se versiona (Isar y Slang).
      steps:
        - gen:isar
        - gen:i18n

    gen:isar:
      description: Genera los esquemas de Isar con build_runner.
      packageFilters:
        dependsOn: build_runner
      exec:
        command: dart run build_runner build

    gen:i18n:
      description: Genera las traducciones de Slang.
      packageFilters:
        fileExists: slang.yaml
      exec:
        command: dart run slang
