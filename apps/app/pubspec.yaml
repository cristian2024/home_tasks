name: home_utility_app
description: Aplicación de utilidades del hogar - ensambla los plugins registrados en tiempo de compilación.
publish_to: none
version: 1.5.1+8

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  bloc: ^9.2.0
  core_contracts: ^0.1.2
  core_di: ^0.1.1
  core_events: ^0.1.1
  core_ui: ^0.1.1
  core_utils: ^0.1.0
  design_system: ^0.1.2
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ">=14.0.0 <17.0.0"
  hardware_mobile_scanner: ^0.1.0
  hardware_nfc_manager: ^0.1.0
  hardware_permission_handler: ^0.1.0
  item_tracker_isar: ^0.1.1
  plugin_item_tracker: ^3.0.0
  plugin_shopping_list: ^0.1.0
  share_native: ^0.1.0
  shared_preferences: ^2.5.6
  shopping_list_isar: ^0.1.0
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  storage_isar: ^0.2.0

dev_dependencies:
  bloc_test: ^10.0.0
  core_hardware: ^0.2.0
  core_share: ^0.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Carpeta temporal de los integration_test.
  path_provider: ^2.1.6
  shopping_list_contract: ^0.1.0

flutter:
  uses-material-design: true
  # Todos los textos de cada paquete, inyectados por la app (lib/i18n/injected_translations.dart).
  assets:
    - assets/i18n/core_ui/
    - assets/i18n/item_tracker/
    - assets/i18n/shopping_list/
