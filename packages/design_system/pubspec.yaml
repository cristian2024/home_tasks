name: design_system
description: Sistema de diseño centralizado - tokens, temas claro/oscuro y componentes accesibles.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  core_ui: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/LICENSE-Lucide.txt
    - assets/fonts/OFL.txt
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
