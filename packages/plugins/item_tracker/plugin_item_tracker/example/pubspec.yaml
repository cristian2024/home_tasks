name: item_tracker_example
description: App anfitriona mínima para probar el plugin item_tracker en un dispositivo real.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  core_di: ^0.1.1
  core_events: ^0.1.0
  core_ui: ^0.1.1
  core_utils: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  go_router: ">=14.0.0 <17.0.0"
  hardware_mobile_scanner: ^0.1.0
  hardware_nfc_manager: ^0.1.0
  hardware_permission_handler: ^0.1.0
  item_tracker_isar: ^0.1.0
  plugin_item_tracker: ^3.0.0
  storage_isar: ^0.2.0

dev_dependencies:
  core_hardware: ^0.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Todos los textos de cada paquete, inyectados por el ejemplo (lib/src/injected_translations.dart).
  assets:
    - assets/i18n/core_ui/
    - assets/i18n/item_tracker/
