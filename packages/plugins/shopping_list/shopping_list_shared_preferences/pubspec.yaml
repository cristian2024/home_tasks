version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  core_di: ^0.1.2
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  shopping_list_domain: ^0.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
