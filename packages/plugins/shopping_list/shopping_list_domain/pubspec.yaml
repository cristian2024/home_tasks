  equatable: ^3.0.0
  recurrence: ^0.1.0
  # Solo para los tests de contrato de `package:shopping_list_domain/testing.dart`.
  test: ^1.28.0
  urgency: ^0.1.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
