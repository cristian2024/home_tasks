name: item_tracker_example
description: App anfitriona mínima para probar el plugin item_tracker en un dispositivo real.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  core_di: any
  core_events: any
  core_storage: any
  core_ui: any
  core_utils: any
  design_system: any
  flutter:
    sdk: flutter
  go_router: ">=14.0.0 <17.0.0"
  path_provider: ^2.1.6
  plugin_item_tracker: any

dev_dependencies:
  core_hardware: any
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
