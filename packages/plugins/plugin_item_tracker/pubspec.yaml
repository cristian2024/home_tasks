name: plugin_item_tracker
description: Plugin de identificación y seguimiento de objetos del hogar (QR, códigos de barras y NFC).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  core_events: ^0.1.0
  core_storage: ^0.1.0
  core_utils: ^0.1.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator: 3.3.2
  mocktail: ^1.0.4
