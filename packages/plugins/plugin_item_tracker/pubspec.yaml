name: plugin_item_tracker
description: Plugin de identificación y seguimiento de objetos del hogar (QR, códigos de barras y NFC).
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  bloc: ^9.2.0
  core_contracts: any
  core_di: any
  core_events: any
  core_hardware: any
  core_storage: any
  core_ui: any
  core_utils: any
  design_system: any
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ">=14.0.0 <17.0.0"
  slang: ^4.19.0
  slang_flutter: ^4.19.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ">=2.4.0 <3.0.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator: 3.3.2
  mocktail: ^1.0.4
