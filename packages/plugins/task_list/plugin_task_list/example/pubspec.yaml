name: task_list_example
description: App anfitriona mínima para probar el plugin de lista de tareas en un dispositivo real.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  core_di: ^0.1.1
  core_events: ^0.2.0
  core_ui: ^0.1.1
  core_utils: ^0.1.2
  design_system: ^0.3.1
  flutter:
    sdk: flutter
  go_router: ">=14.0.0 <17.0.0"
  plugin_task_list: ^0.1.0
  storage_isar: ^0.2.0
  task_list_isar: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Todos los textos de cada paquete, inyectados por el ejemplo (lib/src/injected_translations.dart).
  assets:
    - assets/i18n/core_ui/
    - assets/i18n/task_list/
