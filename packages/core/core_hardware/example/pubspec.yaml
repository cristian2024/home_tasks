name: core_hardware_example
description: App de ejemplo para probar core_hardware (cámara, NFC y permisos) en un dispositivo real.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  core_hardware: ^0.2.0
  flutter:
    sdk: flutter
  hardware_mobile_scanner: ^0.1.0
  hardware_nfc_manager: ^0.1.0
  hardware_permission_handler: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
