name: core_sync
description: Contratos y modelo de la sincronización entre dispositivos (registros de cambio, vector de versiones, metadatos por campo), en Dart puro. El motor va en sync_engine y las implementaciones en packages/adapters/.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  # Solo para los tests de contrato (StreamQueue).
  async: ^2.13.1
  core_di: ^0.1.2
  equatable: ^3.0.0
  hlc: ^0.1.0
  # Solo para los tests de contrato de `package:core_sync/testing.dart`.
  test: ^1.28.0

dev_dependencies:
  flutter_lints: ^6.0.0
