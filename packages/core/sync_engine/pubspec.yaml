name: sync_engine
description: Motor de la sincronización entre dispositivos (sesiones, fusión, gossip, hogar, bandeja de conflictos y planificación) y su simulador, en Dart puro.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  async: ^2.13.1
  # Solo para el simulador de `package:sync_engine/testing.dart`.
  collection: ^1.19.1
  core_di: ^0.1.2
  core_secrets: ^0.1.0
  core_sync: ^0.1.0
  core_utils: ^0.1.1
  equatable: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.28.0
